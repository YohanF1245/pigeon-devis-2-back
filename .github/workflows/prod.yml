name: Production Deployment

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: unnecessary
          if_key_exists: fail

      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Setup PostgreSQL
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "sudo -u postgres psql << 'EOSQL'
          DO \$\$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_user WHERE usename = '${DB_USER}') THEN
              CREATE USER ${DB_USER} WITH PASSWORD '${DB_PASSWORD}';
            END IF;
            IF NOT EXISTS (SELECT FROM pg_database WHERE datname = '${DB_NAME}') THEN
              CREATE DATABASE ${DB_NAME};
            END IF;
            GRANT ALL PRIVILEGES ON DATABASE ${DB_NAME} TO ${DB_USER};
          END
          \$\$;
          EOSQL"
        env:
          DB_USER: pigeon_user
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: pigeon_devis

      - name: Create .env file
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "cat > ~/pigeon-devis-2-back/.env << 'EOL'
          NODE_ENV=production
          PORT=${{ secrets.PORT }}
          DATABASE_URL=postgresql://pigeon_user:${{ secrets.DB_PASSWORD }}@localhost:5432/pigeon_devis
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          FRONT_URL=${{ secrets.FRONT_URL }}
          EOL"

      - name: Deploy to VPS
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
            cd pigeon-devis-2-back && \
            docker compose pull && \
            docker compose up -d --force-recreate && \
            docker system prune -f" 