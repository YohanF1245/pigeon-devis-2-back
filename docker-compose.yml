version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pigeon-devis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pigeon-devis}
      POSTGRES_DB: ${POSTGRES_DB:-pigeon-devis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./doc/database-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pigeon-devis}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./test:/app/test
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pigeon-devis}:${POSTGRES_PASSWORD:-pigeon-devis}@postgres:5432/${POSTGRES_DB:-pigeon-devis}
      - JWT_SECRET=${JWT_SECRET:-mysecretkey}
      - JWT_EXPIRATION=${JWT_EXPIRATION:-3600}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - APP_URL=${APP_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: 